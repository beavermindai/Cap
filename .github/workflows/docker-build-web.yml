name: "Docker Build Web"

# Beavermind fork: builds the amd64 image for rec.beavermind.cloud on every
# push to the `beavermind` branch and publishes it as
#   ghcr.io/beavermindai/cap-web:bm-<short sha>   (immutable, pin this)
#   ghcr.io/beavermindai/cap-web:beavermind       (moving)
# Upstream builds multi-arch on manual dispatch only; our VPS is x86_64.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Moving tag to apply in addition to bm-<sha>"
        required: false
        default: "beavermind"
        type: string
  push:
    branches:
      - beavermind

jobs:
  build:
    name: Build Docker Image (amd64)
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Create .env file
        run: |
          echo "WEB_URL=http://localhost:3000" > .env
          echo "NEXT_PUBLIC_DOCKER_BUILD=true" >> .env

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image tags
        run: |
          echo "REPOSITORY_OWNER=${GITHUB_REPOSITORY_OWNER@L}" >> "$GITHUB_ENV"
          echo "SHORT_SHA=${GITHUB_SHA::7}" >> "$GITHUB_ENV"

      - name: Build and Push Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/web/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/${{ env.REPOSITORY_OWNER }}/cap-web:bm-${{ env.SHORT_SHA }}
            ghcr.io/${{ env.REPOSITORY_OWNER }}/cap-web:${{ inputs.tag || 'beavermind' }}
          cache-from: type=gha,scope=buildx-amd64
          cache-to: type=gha,mode=max,scope=buildx-amd64
